name: github-warden
description: >
  Keep your GitHub org and repos in declared state — reconcile, guardrails,
  drift correction. Runs warden's reconcile or audit subcommand as a native
  Node.js action with GitHub App authentication.

branding:
  icon: shield
  color: blue

inputs:
  command:
    description: "Subcommand to run: reconcile or audit."
    required: false
    default: reconcile

  config:
    description: "Path to the governance config file (YAML, JSON, or a .ts policy)."
    required: true

  config-mode:
    description: >
      How a .ts policy is evaluated: fold (reduce it to its value without
      running it), run (import it), or check (both, failing when they differ).
      Default: fold.
    required: false

  mode:
    description: "Reconcile mode: dry-run or apply. Only used when command is reconcile."
    required: false
    default: dry-run

  cycles:
    description: >
      Comma-separated list of cycle names to run (e.g. branch-protection).
      Defaults to all cycles. Only used when command is reconcile.
    required: false

  app-id:
    description: "GitHub App ID (numeric)."
    required: true

  installation-id:
    description: "GitHub App installation ID (numeric)."
    required: true

  private-key:
    description: "GitHub App private key in PEM format. Pass as a secret."
    required: true

  fail-on:
    description: >
      Audit failure threshold: none, merge-worthy, or any.
      Exit 4 when findings exceed this level. Only used when command is audit.
      Default: none.
    required: false
    default: none

  allow-guardrail-override:
    description: >
      Set to 'true' to apply changes even when guardrails trip.
      Only used when command is reconcile.
    required: false
    default: "false"

  drift-issue:
    description: >
      Set to 'true' on a dry-run reconcile to keep one issue tracking the drift
      it finds: opened or updated while GitHub differs from the policy, closed
      on the first run that matches. The App needs Issues read and write on the
      issue repository. Cannot be combined with mode apply or cycles.
    required: false
    default: "false"

  drift-issue-repo:
    description: >
      owner/name of the repository the drift issue lives in. Default: the
      workflow's repository. Only used with drift-issue.
    required: false

runs:
  using: node24
  main: action/index.mjs
