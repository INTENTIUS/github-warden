site_name: github-warden
site_description: Keep your GitHub org and repos in declared state — reconcile, guardrails, drift correction
site_url: https://intentius.io/github-warden/
# The markdown lives at the repo root (for GitHub); `mkdocs-stage.sh` copies the curated
# set into _docs/ for the build (docs/ is a real source directory here, so the staging
# dir is separate). Run `just docs` (or the Pages workflow).
docs_dir: _docs
site_dir: _site
use_directory_urls: true

repo_url: https://github.com/INTENTIUS/github-warden
repo_name: INTENTIUS/github-warden

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

nav:
  - Home: README.md
  - Policy: POLICY.md
  - CLI: CLI.md
  - Cycles: CYCLES.md
  - CI pipelines: CI.md
  - Setup: SETUP.md
  - GitHub App setup: docs/github-app-setup.md
  - Changelog: CHANGELOG.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
